version: '3.8'

services:
  vote:
    build: ./vote
    command: python app.py
    ports:
      - "5000:5000"
    depends_on:
      - redis
    networks:
      - app-network
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build: ./worker
    depends_on:
      - redis
      - db
    networks:
      - app-network
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
    healthcheck:
      test: ["CMD", "dotnet", "--info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  result:
    build: ./result
    command: npm start
    ports:
      - "5001:5001"
    depends_on:
      - db
    networks:
      - app-network
    environment:
      - POSTGRES_HOST=db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: "redis:alpine"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - redis-data:/data

  db:
    image: "postgres:alpine"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "postgres"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db-data:
  redis-data:

networks:
  app-network:
